<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Manufacturing Registration</title>
    <link rel="stylesheet" href="renutri2.css">
</head>

<body>

<div class="banner">
    <h1 style="color:white;">
        GEETHUM FOOD <br>
        MANUFACTURING <br>
        COMPANY
    </h1>

    <h2>
        <button type="button">REGISTER NOW</button>
    </h2>
</div>

<form class="kitchan" action="lognutri.html">

<table>

<tr>
<td>Company Name*</td>
<td><input type="text" placeholder="Enter Company Name"></td>
</tr>

<tr>
<td>Contact Person*</td>
<td><input type="text" placeholder="Enter Contact Person"></td>
</tr>

<tr>
<td>Phone Number*</td>
<td><input type="tel" placeholder="Enter Phone Number"></td>
</tr>

<tr>
<td>Email Address*</td>
<td><input type="email" placeholder="Enter Email"></td>
</tr>

<tr>
<td>Company Address*</td>
<td><input type="text" placeholder="Enter Address"></td>
</tr>

<tr>
<td>City*</td>
<td><input type="text" placeholder="Enter City"></td>
</tr>

<tr>
<td>Product Category*</td>
<td>
<select>
    <option>Select Product</option>
    <option>Biscuits</option>
    <option>Snacks</option>
    <option>Juices</option>
    <option>Bakery Products</option>
    <option>Pickles</option>
</select>
</td>
</tr>

<tr>
<td>Business Type*</td>
<td>
<select>
    <option>Select Type</option>
    <option>Distributor</option>
    <option>Retailer</option>
    <option>Wholesaler</option>
</select>
</td>
</tr>

<tr>
<td>Password*</td>
<td><input type="password" placeholder="Enter Password"></td>
</tr>

<tr>
<td colspan="2">
<button type="submit">REGISTER</button>
</td>
</tr>

</table>

</form>

</body>
</html>
