<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Manufacturing Login</title>
    <link rel="stylesheet" href="lognutri.css">
</head>

<body>

<div class="container">

    <h1 style="color:white;">Food Manufacturing Login</h1>

    <form class="login" action="home2.html">

        <label>Company ID</label>
        <input type="text" placeholder="Enter Company ID">

        <label>Email Address</label>
        <input type="email" placeholder="Enter Email">

        <label>Password</label>
        <input type="password" placeholder="Enter Password">

        <label>Department</label>
        <select>
            <option>Select Department</option>
            <option>Production</option>
            <option>Quality Control</option>
            <option>Packaging</option>
            <option>Sales</option>
            <option>Distribution</option>
        </select>

        <button type="submit">LOGIN</button>

        <p style="text-align:center;">
            New Company?
            <a href="renutri.html">Register Here</a>
        </p>

    </form>

</div>

</body>
</html>
